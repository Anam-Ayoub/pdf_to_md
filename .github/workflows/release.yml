name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone executable
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "pdf-to-md" \
            --add-data "ui:ui" \
            --add-data "assets:assets" \
            --collect-all magika \
            --collect-all markitdown \
            --collect-all pdfminer \
            --collect-all onnxruntime \
            --collect-all webview \
            --collect-all PyQt6 \
            pdf_to_md_webview.py

      - name: Package Linux distribution
        run: |
          tar -czvf pdf-to-md-linux-x86_64.tar.gz -C dist pdf-to-md

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-to-md-linux-x86_64
          path: pdf-to-md-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone executable
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "PDFtoMarkdown" ^
            --add-data "ui;ui" ^
            --add-data "assets;assets" ^
            --collect-all magika ^
            --collect-all markitdown ^
            --collect-all pdfminer ^
            --collect-all onnxruntime ^
            --collect-all webview ^
            --collect-all PyQt6 ^
            pdf_to_md_webview.py
        shell: cmd

      - name: Package Windows distribution
        run: |
          Compress-Archive -Path dist/PDFtoMarkdown -DestinationPath pdf-to-md-windows-x86_64.zip
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-to-md-windows-x86_64
          path: pdf-to-md-windows-x86_64.zip

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: pdf-to-md-linux-x86_64

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: pdf-to-md-windows-x86_64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pdf-to-md-linux-x86_64.tar.gz
            pdf-to-md-windows-x86_64.zip
          generate_release_notes: true
