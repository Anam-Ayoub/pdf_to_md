<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF to Markdown</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", sans-serif;
      background: #f7f5f0;
      color: #18181b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      overflow: hidden;
      letter-spacing: -0.01em;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .header-icon {
      width: 38px;
      height: 38px;
      background: #18181b;
      color: #ffffff;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.5px;
    }

    .header-text h1 {
      font-size: 17px;
      font-weight: 700;
      color: #18181b;
      line-height: 1.2;
    }

    .header-text p {
      font-size: 12px;
      color: #71717a;
      margin-top: 2px;
    }

    /* Dropzone */
    .dropzone {
      border: 1.5px dashed #d4d0c7;
      background: #ffffff;
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: #18181b;
      background: #faf8f5;
      transform: translateY(-1px);
    }

    .dropzone-icon {
      width: 36px;
      height: 36px;
      margin: 0 auto 10px auto;
      border-radius: 50%;
      background: #f4f1ea;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }

    .dropzone-title {
      font-size: 13.5px;
      font-weight: 600;
      color: #18181b;
      margin-bottom: 3px;
    }

    .dropzone-subtitle {
      font-size: 11.5px;
      color: #8c887e;
    }

    /* Selected File View */
    .file-card {
      display: none;
      background: #ffffff;
      border: 1px solid #18181b;
      border-radius: 12px;
      padding: 16px 18px;
      align-items: center;
      gap: 14px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
      animation: fadeIn 0.2s ease-out;
    }

    .file-badge {
      background: #18181b;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      padding: 6px 9px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    .file-info {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      font-size: 13px;
      font-weight: 600;
      color: #18181b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-size {
      font-size: 11px;
      color: #71717a;
      margin-top: 2px;
    }

    .btn-change {
      background: transparent;
      border: 1px solid #d4d0c7;
      color: #18181b;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-change:hover {
      background: #f4f1ea;
      border-color: #18181b;
    }

    /* Progress & Status */
    .progress-container {
      margin: 18px 0 10px 0;
      display: none;
    }

    .progress-bar-bg {
      height: 4px;
      background: #e7e4dc;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 30%;
      background: #18181b;
      border-radius: 2px;
      animation: indeterminate 1.4s infinite cubic-bezier(0.65, 0, 0.35, 1);
    }

    @keyframes indeterminate {
      0% { transform: translateX(-100%); width: 25%; }
      50% { transform: translateX(80%); width: 50%; }
      100% { transform: translateX(320%); width: 25%; }
    }

    .status-text {
      font-size: 12px;
      color: #71717a;
      margin-top: 8px;
      min-height: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-text.success {
      color: #15803d;
      font-weight: 600;
    }

    .status-text.error {
      color: #b91c1c;
      font-weight: 600;
    }

    /* Minimalist Black Action Buttons */
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .btn {
      flex: 1;
      height: 42px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      letter-spacing: 0.1px;
    }

    .btn-primary {
      background: #18181b;
      color: #ffffff;
      border: 1px solid #18181b;
    }

    .btn-primary:hover:not(:disabled) {
      background: #27272a;
      border-color: #27272a;
    }

    .btn-primary:active:not(:disabled) {
      background: #09090b;
      transform: scale(0.99);
    }

    .btn-primary:disabled {
      background: #e4e4e7;
      border-color: #e4e4e7;
      color: #a1a1aa;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #ffffff;
      border: 1px solid #18181b;
      color: #18181b;
      flex: 0 0 auto;
      padding: 0 16px;
      display: none;
    }

    .btn-secondary:hover {
      background: #f4f1ea;
    }

    .btn-secondary:active {
      background: #e7e4dc;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-icon">M↓</div>
    <div class="header-text">
      <h1>PDF to Markdown</h1>
      <p>Clean text extraction with Microsoft MarkItDown</p>
    </div>
  </div>

  <!-- File Dropzone -->
  <div id="dropzone" class="dropzone" onclick="onChooseFile()">
    <div class="dropzone-icon">📄</div>
    <div class="dropzone-title">Select a PDF file</div>
    <div class="dropzone-subtitle">Click anywhere to browse</div>
  </div>

  <!-- Selected File View -->
  <div id="fileCard" class="file-card">
    <div class="file-badge">PDF</div>
    <div class="file-info">
      <div id="fileName" class="file-name">document.pdf</div>
      <div id="fileSize" class="file-size">1.2 MB</div>
    </div>
    <button class="btn-change" onclick="onChooseFile()">Change</button>
  </div>

  <!-- Progress -->
  <div id="progressContainer" class="progress-container">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill"></div>
    </div>
  </div>

  <!-- Status -->
  <div id="statusText" class="status-text">Select a PDF to start</div>

  <!-- Action Buttons -->
  <div class="actions">
    <button id="btnConvert" class="btn btn-primary" onclick="onConvert()" disabled>
      Convert to Markdown
    </button>
    <button id="btnOpenFolder" class="btn btn-secondary" onclick="onOpenFolder()">
      Open Folder
    </button>
  </div>

  <script>
    let currentFile = null;
    let isConverting = false;

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    async function onChooseFile() {
      if (isConverting) return;
      try {
        const file = await window.pywebview.api.select_file();
        if (file) {
          currentFile = file;
          document.getElementById('dropzone').style.display = 'none';
          document.getElementById('fileCard').style.display = 'flex';
          document.getElementById('fileName').innerText = file.name;
          document.getElementById('fileSize').innerText = formatBytes(file.size);
          document.getElementById('btnConvert').disabled = false;
          
          const status = document.getElementById('statusText');
          status.className = 'status-text';
          status.innerText = 'Ready to convert';
          document.getElementById('btnOpenFolder').style.display = 'none';
        }
      } catch (err) {
        console.error('File select error:', err);
      }
    }

    async function onConvert() {
      if (!currentFile || isConverting) return;

      isConverting = true;
      document.getElementById('btnConvert').disabled = true;
      document.getElementById('btnConvert').innerText = 'Converting...';
      document.getElementById('progressContainer').style.display = 'block';
      
      const status = document.getElementById('statusText');
      status.className = 'status-text';
      status.innerText = 'Converting document...';

      try {
        const res = await window.pywebview.api.convert_pdf(currentFile.path);
        document.getElementById('progressContainer').style.display = 'none';
        isConverting = false;
        document.getElementById('btnConvert').innerText = 'Convert to Markdown';

        if (res.success) {
          status.className = 'status-text success';
          status.innerText = `Done! Saved as ${res.output_name}`;
          document.getElementById('btnOpenFolder').style.display = 'flex';
        } else {
          status.className = 'status-text error';
          status.innerText = `Error: ${res.error}`;
          document.getElementById('btnConvert').disabled = false;
        }
      } catch (err) {
        document.getElementById('progressContainer').style.display = 'none';
        isConverting = false;
        document.getElementById('btnConvert').disabled = false;
        document.getElementById('btnConvert').innerText = 'Convert to Markdown';
        status.className = 'status-text error';
        status.innerText = `Error: ${err}`;
      }
    }

    async function onOpenFolder() {
      if (!currentFile) return;
      await window.pywebview.api.open_folder();
    }
  </script>
</body>
</html>
