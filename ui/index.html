<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF to Markdown</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .header-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .header-text h1 {
      font-size: 18px;
      font-weight: 700;
      color: #f8fafc;
    }

    .header-text p {
      font-size: 12px;
      color: #94a3b8;
    }

    /* Card & Dropzone */
    .dropzone {
      border: 2px dashed #334155;
      background: #1e293b;
      border-radius: 14px;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: #3b82f6;
      background: #1e293b;
      transform: translateY(-1px);
    }

    .dropzone-icon {
      font-size: 36px;
      margin-bottom: 8px;
      display: inline-block;
    }

    .dropzone-title {
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 4px;
    }

    .dropzone-subtitle {
      font-size: 12px;
      color: #64748b;
    }

    /* Selected File Card */
    .file-card {
      display: none;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 16px;
      align-items: center;
      gap: 14px;
      animation: fadeIn 0.25s ease;
    }

    .file-badge {
      background: #ef4444;
      color: white;
      font-size: 11px;
      font-weight: 800;
      padding: 6px 10px;
      border-radius: 8px;
      letter-spacing: 0.5px;
    }

    .file-info {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-size {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
    }

    .btn-change {
      background: transparent;
      border: 1px solid #475569;
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-change:hover {
      background: #334155;
      color: #ffffff;
    }

    /* Progress & Status */
    .progress-container {
      margin: 18px 0 10px 0;
      display: none;
    }

    .progress-bar-bg {
      height: 6px;
      background: #1e293b;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 30%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 3px;
      animation: indeterminate 1.5s infinite linear;
    }

    @keyframes indeterminate {
      0% { transform: translateX(-100%); width: 30%; }
      50% { transform: translateX(100%); width: 60%; }
      100% { transform: translateX(350%); width: 30%; }
    }

    .status-text {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 8px;
      min-height: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-text.success {
      color: #4ade80;
    }

    .status-text.error {
      color: #f87171;
    }

    /* Actions */
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .btn {
      flex: 1;
      height: 42px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .btn-primary:hover:not(:disabled) {
      background: #1d4ed8;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
    }

    .btn-primary:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-secondary {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      flex: 0 0 auto;
      padding: 0 16px;
      display: none;
    }

    .btn-secondary:hover {
      background: #334155;
      border-color: #475569;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-icon">M↓</div>
    <div class="header-text">
      <h1>PDF to Markdown</h1>
      <p>Clean text extraction with Microsoft MarkItDown</p>
    </div>
  </div>

  <!-- File Dropzone -->
  <div id="dropzone" class="dropzone" onclick="onChooseFile()">
    <div class="dropzone-icon">📄</div>
    <div class="dropzone-title">Choose a PDF file</div>
    <div class="dropzone-subtitle">Click anywhere to browse</div>
  </div>

  <!-- Selected File View -->
  <div id="fileCard" class="file-card">
    <div class="file-badge">PDF</div>
    <div class="file-info">
      <div id="fileName" class="file-name">document.pdf</div>
      <div id="fileSize" class="file-size">1.2 MB</div>
    </div>
    <button class="btn-change" onclick="onChooseFile()">Change</button>
  </div>

  <!-- Progress -->
  <div id="progressContainer" class="progress-container">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill"></div>
    </div>
  </div>

  <!-- Status -->
  <div id="statusText" class="status-text">Select a PDF to start</div>

  <!-- Action Buttons -->
  <div class="actions">
    <button id="btnConvert" class="btn btn-primary" onclick="onConvert()" disabled>
      Convert to Markdown
    </button>
    <button id="btnOpenFolder" class="btn btn-secondary" onclick="onOpenFolder()">
      Open Folder
    </button>
  </div>

  <script>
    let currentFile = null;
    let isConverting = false;

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    async function onChooseFile() {
      if (isConverting) return;
      try {
        const file = await window.pywebview.api.select_file();
        if (file) {
          currentFile = file;
          document.getElementById('dropzone').style.display = 'none';
          document.getElementById('fileCard').style.display = 'flex';
          document.getElementById('fileName').innerText = file.name;
          document.getElementById('fileSize').innerText = formatBytes(file.size);
          document.getElementById('btnConvert').disabled = false;
          
          const status = document.getElementById('statusText');
          status.className = 'status-text';
          status.innerText = 'Ready to convert';
          document.getElementById('btnOpenFolder').style.display = 'none';
        }
      } catch (err) {
        console.error('File select error:', err);
      }
    }

    async function onConvert() {
      if (!currentFile || isConverting) return;

      isConverting = true;
      document.getElementById('btnConvert').disabled = true;
      document.getElementById('btnConvert').innerText = 'Converting...';
      document.getElementById('progressContainer').style.display = 'block';
      
      const status = document.getElementById('statusText');
      status.className = 'status-text';
      status.innerText = 'Processing document...';

      try {
        const res = await window.pywebview.api.convert_pdf(currentFile.path);
        document.getElementById('progressContainer').style.display = 'none';
        isConverting = false;
        document.getElementById('btnConvert').innerText = 'Convert to Markdown';

        if (res.success) {
          status.className = 'status-text success';
          status.innerText = `Done! Saved as ${res.output_name}`;
          document.getElementById('btnOpenFolder').style.display = 'flex';
        } else {
          status.className = 'status-text error';
          status.innerText = `Error: ${res.error}`;
          document.getElementById('btnConvert').disabled = false;
        }
      } catch (err) {
        document.getElementById('progressContainer').style.display = 'none';
        isConverting = false;
        document.getElementById('btnConvert').disabled = false;
        document.getElementById('btnConvert').innerText = 'Convert to Markdown';
        status.className = 'status-text error';
        status.innerText = `Error: ${err}`;
      }
    }

    async function onOpenFolder() {
      if (!currentFile) return;
      await window.pywebview.api.open_folder();
    }
  </script>
</body>
</html>
